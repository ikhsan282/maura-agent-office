<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maura Agent Office</title>
<style>
:root {
  --bg: #0a0e14;
  --surface: #141920;
  --surface-hi: #1c232e;
  --border: #2d3540;
  --text: #e6e8eb;
  --text-dim: #8a93a5;
  --accent-trans: #3b82f6;
  --accent-trans-dim: #1e3a8a;
  --accent-print: #a3423f;
  --accent-print-dim: #7c312f;
  --accent-command: #eab308;
  --status-working: #10b981;
  --status-idle: #6b7280;
  --status-recent: #06b6d4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  touch-action: none;
}

#scene-container {
  position: fixed;
  inset: 0;
  z-index: 1;
}

.hud {
  position: fixed;
  top: 1rem;
  left: 1rem;
  z-index: 10;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem;
  min-width: 200px;
  pointer-events: auto;
}

.hud h2 {
  font-size: 0.875rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  margin-bottom: 0.75rem;
}

.metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
}

.metric {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.metric-label {
  font-size: 0.75rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.metric-value {
  font-size: 1.5rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.metric-value.working { color: var(--status-working); }
.metric-value.ready { color: var(--accent-trans); }

.filters {
  position: fixed;
  top: 1rem;
  right: 1rem;
  z-index: 10;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  pointer-events: auto;
}

.filters h3 {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  margin-bottom: 0.25rem;
}

.filter-btn {
  background: var(--surface-hi);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.5rem 0.75rem;
  border-radius: 6px;
  font-size: 0.875rem;
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  font-family: inherit;
}

.filter-btn:hover {
  background: var(--border);
  border-color: var(--text-dim);
}

.filter-btn.active {
  background: var(--accent-trans);
  border-color: var(--accent-trans);
  color: #fff;
}

.controls-help {
  position: fixed;
  bottom: 1rem;
  right: 1rem;
  z-index: 10;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  font-size: 0.75rem;
  color: var(--text-dim);
  max-width: 280px;
  pointer-events: auto;
}

.controls-help h4 {
  font-weight: 600;
  color: var(--text);
  margin-bottom: 0.5rem;
}

.controls-help ul {
  list-style: none;
  line-height: 1.6;
}

.controls-help kbd {
  background: var(--surface-hi);
  padding: 0.125rem 0.375rem;
  border-radius: 3px;
  font-family: monospace;
  font-size: 0.7rem;
}

dialog {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0;
  max-width: 500px;
  width: 90vw;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

dialog::backdrop {
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
}

.dialog-header {
  padding: 1.5rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 1rem;
}

.dialog-header h3 {
  font-size: 1.25rem;
  font-weight: 600;
  line-height: 1.3;
}

.dialog-close {
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 1.5rem;
  cursor: pointer;
  padding: 0;
  width: 2rem;
  height: 2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  transition: all 0.15s;
  flex-shrink: 0;
}

.dialog-close:hover {
  background: var(--surface-hi);
  color: var(--text);
}

.dialog-body {
  padding: 1.5rem;
}

.agent-meta {
  display: flex;
  gap: 0.75rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}

.meta-badge {
  background: var(--surface-hi);
  padding: 0.375rem 0.75rem;
  border-radius: 6px;
  font-size: 0.875rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}

.status-dot.working { background: var(--status-working); }
.status-dot.idle { background: var(--status-idle); animation: none; }
.status-dot.recent { background: var(--status-recent); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

@media (prefers-reduced-motion: reduce) {
  .status-dot { animation: none !important; }
  * { transition: none !important; }
}

.task-details {
  background: var(--surface-hi);
  padding: 1rem;
  border-radius: 8px;
  margin-top: 1rem;
}

.task-details dt {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  margin-bottom: 0.25rem;
}

.task-details dd {
  margin-bottom: 1rem;
  line-height: 1.5;
}

.task-details dd:last-child {
  margin-bottom: 0;
}

.loading, .error {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  z-index: 100;
  flex-direction: column;
  gap: 1rem;
}

.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid var(--border);
  border-top-color: var(--accent-trans);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.error-msg {
  color: var(--text-dim);
  text-align: center;
  max-width: 400px;
}

footer {
  position: fixed;
  bottom: 1rem;
  left: 1rem;
  font-size: 0.75rem;
  color: var(--text-dim);
  z-index: 10;
  pointer-events: none;
}

@media (max-width: 768px) {
  .hud, .filters, .controls-help {
    font-size: 0.875rem;
    padding: 0.75rem;
  }
  
  .metric-value {
    font-size: 1.25rem;
  }
  
  .controls-help {
    display: none;
  }
}
</style>
</head>
<body>

<div id="scene-container"></div>

<div class="hud">
  <h2>Metrics</h2>
  <div class="metrics">
    <div class="metric">
      <div class="metric-label">Working</div>
      <div class="metric-value working" id="metric-working">0</div>
    </div>
    <div class="metric">
      <div class="metric-label">Ready</div>
      <div class="metric-value ready" id="metric-ready">0</div>
    </div>
    <div class="metric">
      <div class="metric-label">Done Today</div>
      <div class="metric-value" id="metric-done">0</div>
    </div>
    <div class="metric">
      <div class="metric-label">System</div>
      <div class="metric-value" id="metric-system">—</div>
    </div>
  </div>
</div>

<div class="filters">
  <h3>Filters</h3>
  <button class="filter-btn active" data-filter="all">All Agents</button>
  <button class="filter-btn" data-filter="working">Working</button>
  <button class="filter-btn" data-filter="idle">Idle</button>
  <button class="filter-btn" data-filter="recent">Recent</button>
</div>

<div class="controls-help">
  <h4>Controls</h4>
  <ul>
    <li><kbd>Left Click</kbd> + drag to pan</li>
    <li><kbd>Right Click</kbd> + drag to rotate</li>
    <li><kbd>Scroll</kbd> to zoom</li>
    <li><kbd>Arrow Keys</kbd> to navigate</li>
    <li><kbd>Click Agent</kbd> for details</li>
  </ul>
</div>

<dialog id="agent-dialog">
  <div class="dialog-header">
    <h3 id="dialog-title"></h3>
    <button class="dialog-close" aria-label="Close">&times;</button>
  </div>
  <div class="dialog-body">
    <div class="agent-meta" id="dialog-meta"></div>
    <div id="dialog-task"></div>
  </div>
</dialog>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div>Loading office...</div>
</div>

<footer>Original dashboard for Maura Group</footer>

  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
